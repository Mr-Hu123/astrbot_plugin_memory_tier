name: astrbot_plugin_memory_tier
display_name: 分层记忆
short_desc: 把长期记忆拆成「画像 / 摘要 / 日记」三层，只注入摘要、按需翻原文，省 token。
desc: |
  分层的长期记忆插件：画像（profile）常驻注入、滚动摘要（summary）次之、每日三行日记按天注入，
  历史正文交给 AstrBot 自带的上下文压缩。所有记忆都是纯文本文件，可读、可手改、可用 git 备份。
version: v1.0.0
author: dsh-deploy
repo: https://github.com/your-name/astrbot_plugin_memory_tier
tags:
